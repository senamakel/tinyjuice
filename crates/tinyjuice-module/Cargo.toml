[package]
rust-version = "1.88"
name = "tinyjuice-module"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyJuice."
repository = "https://github.com/tinyhumansai/tinyjuice"
publish = false

[features]
# Link this adapter into a host binary without exporting the shared C names.
static-link = []
linked = ["static-link"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyjuice = { version = "0.11.0", path = "../..", default-features = false, features = ["jq"] }
# The interface vocabulary. Shared with hosts, so this adapter cannot drift
# from what a caller was compiled against.
tinyjuice-bus = { version = "0.11.0", path = "../tinyjuice-bus" }
tinybus = { version = "=0.3.3", default-features = false, features = ["macros", "modules"] }
tinybus-module = "=0.3.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
# The CCR store's durable tier is blobs on the host's storage ports, reached
# over the storage bus. Keep the adapter and test client on the same released
# TSD source revision as the bus and drivers. The module has no storage backend
# or file of its own.
tinyjuice-drivers = { path = "../tinyjuice-drivers" }
tinystoragedrivers-core = { version = "=1.8.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "595723e1b1cabeb3d36f0c5b6ff2e11b458e7558" }
tinystoragedrivers-busproxy = { version = "=1.8.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "595723e1b1cabeb3d36f0c5b6ff2e11b458e7558" }
log = "0.4"

[dev-dependencies]
# Tests serve the storage objects on the in-memory broker the module connects to.
tinystoragedrivers-client = { version = "=1.8.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "595723e1b1cabeb3d36f0c5b6ff2e11b458e7558" }
tinybus = { version = "=0.3.3", default-features = false, features = ["test-support"] }
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
