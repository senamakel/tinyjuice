[package]
rust-version = "1.88"
name = "tinyjuice-bus"
version = "0.10.10"
edition = "2024"
license = "GPL-3.0-only"
description = "TinyJuice's transport-free bus and storage needs contracts."
repository = "https://github.com/tinyhumansai/tinyjuice"
readme = "README.md"
keywords = ["tinybus", "compression", "tokens", "contract"]
categories = ["data-structures"]
publish = false

# Deliberately transport-free: a host only needs this vocabulary to call the
# dynamic module, not TinyBus itself, a runtime, or the implementation crate.
[dependencies]
# The wire payloads are encoded into TinyBus JSON frames.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared REPL error vocabulary; no execution dependencies.
thiserror = "2"
# Inherit the immutable, data-only storage schema pin from the workspace.
tinystoragedrivers-bus = { workspace = true }

[dev-dependencies]
# Contract tests pin the JSON representation hosts exchange with the module.
