[package]
rust-version = "1.90"
name = "tinyjuice-bus"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The TinyBus wire contract for TinyJuice: member names, payload types, and the contract version."
repository = "https://github.com/tinyhumansai/tinyjuice"
readme = "README.md"
keywords = ["tinybus", "compression", "tokens", "contract"]
categories = ["data-structures"]
publish = false

# Deliberately transport-free: a host only needs this vocabulary to call the
# dynamic module, not TinyBus itself, a runtime, or the implementation crate.
[dependencies]
# The wire payloads are encoded into TinyBus JSON frames.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared REPL error vocabulary; no execution dependencies.
thiserror = "2"
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }

[features]
default = []

[dev-dependencies]
# The migration tests run the schema over the in-memory backend.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
