[package]
rust-version = "1.88"
name = "tinyjuice"
version = "0.11.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Pluggable token compression for OpenHuman."
repository = "https://github.com/tinyhumansai/tinyjuice"
readme = "README.md"
keywords = ["llm", "tokens", "compression", "openhuman", "context"]
categories = ["text-processing"]
autobins = false
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/tinybus/",
    "vendor/tinyagents/",
    "crates/tinyjuice-examples/",
    "wiki/",
]

[workspace]
members = ["crates/tinyjuice-bus", "crates/tinyjuice-module", "crates/tinyjuice-drivers"]
default-members = [".", "crates/tinyjuice-bus", "crates/tinyjuice-module", "crates/tinyjuice-drivers"]
exclude = ["vendor/tinybus", "vendor/tinyagents", "crates/tinyjuice-examples"]
resolver = "3"

[workspace.dependencies]
# Pure hosts consume the storage schema without enabling its optional TinyBus
# compatibility client. Keep this revision aligned with the TinyJuice bus
# contract and its isolated, locked consumer proof.
tinystoragedrivers-bus = { version = "=1.10.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "078d2dee0f299d97dbc22fa7210bd64098a4bf59", default-features = false }

[dependencies]
# Optional adapter boundary: REPL ops as `tinytools::Tool` impls.
tinytools = { version = "0.5", git = "https://github.com/tinyhumansai/tinytools", optional = true }
anyhow = { version = "1", optional = true }
uuid = { version = ">=1, <1.27", features = ["v4"], optional = true }
jaq-core = { version = "3", optional = true }
jaq-std = { version = "3", optional = true }
jaq-json = { version = "2", optional = true }
# The wire contract, defined once and shared with the module and with hosts.
# This crate re-exports its types from `src/types.rs` rather than declaring a
# second copy — see the note there.
tinyjuice-bus = { version = "0.11.1", path = "crates/tinyjuice-bus" }
async-trait = "0.1"
dirs = "7"
hex = "0.4"
log = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dependencies.tree-sitter]
version = "0.26"
optional = true

[dependencies.tree-sitter-python]
version = "0.25"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24"
optional = true

[dependencies.tree-sitter-typescript]
version = "0.23"
optional = true

# Grammar crates accept any 0.1 release, but newer releases exceed TinyJuice's
# declared MSRV. Keep their shared ABI dependency within the Rust 1.88 range.
[dependencies.tree-sitter-language]
version = ">=0.1, <0.1.8"
optional = true

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[[bin]]
name = "tinyjuice"
path = "src/bin/tinyjuice.rs"
required-features = ["cli-disk-tier"]

[[bin]]
name = "tinyjuice-reduce"
path = "src/main.rs"
required-features = ["cli-disk-tier"]

# These integration suites launch the CLI binaries, which are unavailable in
# the default host build without the standalone CLI disk-tier feature.
[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli-disk-tier"]

[[test]]
name = "host_cli"
path = "tests/host_cli.rs"
required-features = ["cli-disk-tier"]

[[bench]]
name = "compression"
harness = false

[features]
default = ["tinyjuice-treesitter"]
# Exposes the REPL ops as `tinytools::Tool` impls (see src/repl/tools.rs).
tinytools = ["dep:tinytools", "dep:anyhow", "jq"]
# File-backed CCR cache commands for the standalone CLI only. Hosts use their
# own durable CcrStore implementation through the storage bus.
cli-disk-tier = []
# Turn-bound `MlHost.Generate` registry (src/host/generate.rs).
host = ["dep:anyhow", "dep:uuid"]
# jq-style queries over JSON outputs (the `jq` REPL op and `juice_jq` tool).
jq = ["dep:jaq-core", "dep:jaq-std", "dep:jaq-json"]
tinyjuice-treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-language",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[example]]
name = "repl_tool_schema"
required-features = ["tinytools"]

# tinystoragedrivers names tinybus by git rev; point that source at the same
# vendored checkout so the module and the storage proxy share one `Connection`.
[patch."https://github.com/tinyhumansai/tinybus"]
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }

# The TinyBus transport and macros use this checkout; the module SDK is pinned
# directly to the same published Git revision as the TSD adapter.
[patch.crates-io]
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/tinybus/crates/tinybus-macros" }
